    type: textbox

format:
  html:
    number-sections: false
    theme:
      light: [cosmo, gsa-light.scss]
      dark: [cosmo, gsa-dark.scss]
    highlight-style:
      light: github
      dark: github-dark
    toc-location: right
    toc-title: "On this page"
    toc-depth: 3
    smooth-scroll: true
      #light: [theme_lter-edu-light, _extensions/lter/lter_scss-theme/theme_lter-edu-light.scss]
      #dark: [theme_lter-edu-dark, _extensions/lter/lter_scss-theme/theme_lter-edu-dark.scss]
    anchor-sections: true
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true

editor: visual

execute:
  freeze: auto

link-external-newwindow: true
